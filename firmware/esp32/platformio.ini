; UNTESTED on hardware. Target: ESP32-S3 dev board + MPU-6050 (see ../README.md, bring-up checklist).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I../core
    -DCORE_DEBUG_LEVEL=1
    ; detector B (ML-first) instead of A:   -DPREFALL_DETECTOR_B
    ; print SVM timing and sample-rate stats: -DPREFALL_LOG_TIMING
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1.0
